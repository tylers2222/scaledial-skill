[project]
name = "scaledial-skill"
version = "0.1.0"
description = "Scale-aware system-design explainer videos: plan, narrate, animate, check."
requires-python = ">=3.10,<3.14"
dependencies = [
    "manim>=0.19",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "jsonschema>=4.20",
]

[project.scripts]
explainer = "explainer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explainer"]
